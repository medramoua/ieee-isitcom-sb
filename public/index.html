<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="IEEE Student Branch of ISITCom Hammam Sousse">
    <title>IEEE ISITCom Student Branch</title>
    <link rel="stylesheet" href="/css/site.css">
    <script src="/js/home.js" defer></script>
  </head>
  <body>
    <p id="site-error" class="site-error" role="alert" hidden></p>
    <header class="site-header">
      <a class="site-brand" href="/" aria-label="IEEE ISITCom">
        <span class="ieee-mark">IEEE</span><span><strong>ISITCom</strong><small id="brand-subline"></small></span>
      </a>
      <nav aria-label="Main navigation">
        <a id="nav-about" href="#about"></a><a id="nav-events" href="/events.html"></a><a id="nav-activities" href="#activities"></a>
      </nav>
      <div class="header-actions">
        <a id="locale-fr" href="/?locale=fr" lang="fr">FR</a><a id="locale-en" href="/?locale=en" lang="en">EN</a>
        <a class="admin-link" id="admin-link" href="/admin/login"></a>
      </div>
    </header>
    <main>
      <section class="home-hero">
        <div class="hero-copy">
          <p class="eyebrow" id="home-eyebrow"></p>
          <h1><span id="hero-title"></span><span id="hero-highlight"></span></h1>
          <p class="hero-description" id="hero-description"></p>
          <div class="hero-actions"><a class="button light" href="#join" id="join-button"></a><a class="button outline" href="#about" id="discover-button"></a></div>
          <p class="hero-location"><strong>IEEE</strong> <span id="network-label"></span><span id="location"></span></p>
        </div>
        <div class="hero-orbit" aria-hidden="true"><div class="orbit-card"><strong>IEEE</strong><span>ISITCom</span></div><p id="orbit-one"></p><p id="orbit-two"></p></div>
      </section>
      <section class="site-section about-section" id="about"><div><p class="section-eyebrow" id="about-eyebrow"></p><h2 id="about-title"></h2></div><div><p id="about-description"></p><a href="#focus" id="about-link"></a></div></section>
      <section class="site-section focus-section" id="focus"><div class="section-intro"><p class="section-eyebrow" id="focus-eyebrow"></p><h2 id="focus-title"></h2><p id="focus-description"></p></div><div class="focus-grid" id="focus-grid"></div></section>
      <section class="site-section activities-section" id="activities"><div class="activities-head"><div><p class="section-eyebrow" id="activities-eyebrow"></p><h2 id="activities-title"></h2></div><p id="activities-intro"></p></div><div id="activities-list" class="activities-list"></div></section>
      <section class="join-section" id="join"><div><p class="section-eyebrow" id="join-eyebrow"></p><h2 id="join-title"></h2><p id="join-description"></p></div><a class="button light" href="https://www.ieee.org/membership/join/index.html" target="_blank" rel="noreferrer" id="join-cta"></a></section>
    </main>
    <footer class="site-footer"><p><strong>IEEE ISITCom</strong> · <span id="footer-location"></span></p><p id="footer-line"></p></footer>
  </body>
</html>
